<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>{{ title() }}</mat-card-title>
    <mat-card-subtitle class="status">{{ status() }}</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <p class="summary">{{ shortSummary() }}</p>
  </mat-card-content>
</mat-card>
