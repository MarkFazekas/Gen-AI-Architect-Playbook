name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # nx affected needs the git history
          filter: tree:0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: nrwl/nx-set-shas@v5 # on main: the last green commit is the base

      # fast, fail-first checks
      - run: npx nx sync:check
      - run: npx nx format:check

      # type safety, lint (incl. module boundaries), unit tests, build (incl. template type checks)
      - run: npx nx affected -t lint typecheck test build

      # end-to-end and accessibility (axe, WCAG 2.1 AA)
      - run: npx playwright install --with-deps chromium
      - run: npx nx affected -t e2e

      # workspace-wide tools
      - run: npm run test:lint-rules
      - run: npm run lint:styles
      - run: npm run spell
      - run: npm run knip
      - run: npm run audit

      - if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to HEAD
